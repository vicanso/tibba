[package]
name = "tibba-request"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tibba", "request"]
description = "request for tibba"

[lib]
name = "tibba_request"
path = "src/lib.rs"

[features]
default = []
# 采集对端 TLS 证书有效期到 `HttpStats.tls_cert`，用于证书临期告警。
#
# 默认关闭的两点代价：
# 1. reqwest 的 `tls_info(true)` 会把对端证书 DER 复制进**每个**响应的 extensions，
#    是每响应一次的堆分配；
# 2. x509-parser 带约 8 个传递依赖（asn1-rs / der-parser / nom / oid-registry …）。
# 只有真正要做证书监控的部署才值得付这两笔，故设为 opt-in。
tls-info = ["dep:x509-parser"]

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
# 重试退避的抖动源：纯指数退避会让所有重试者同时回源（thundering herd）
rand = { workspace = true }
reqwest = { workspace = true }
scopeguard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tibba-error = { path = "../tibba-error", version = "0.2.6" }
# 只用 Stopwatch / json_get，不需要 util 的 http 与 compression 簇
tibba-util = { path = "../tibba-util", version = "0.2.6", default-features = false }
# net：SSRF 防护需 lookup_host 解析目标域名。time：重试退避的定时器。
# workspace 默认未启用这两个特性，这里单独开启
tokio = { workspace = true, features = ["time", "net"] }
tracing = { workspace = true }
# 出站请求注入 W3C traceparent，串联下游服务调用链（分布式追踪）
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
x509-parser = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# 响应体上限要跑一个真实的本地 HTTP 服务端才测得准（rt/macros 仅测试用）
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
futures = { workspace = true }

[lints]
workspace = true
