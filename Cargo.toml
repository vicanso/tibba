[package]
name = "tibba"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["tibba"]
description = "tibba is a framework for building web applications"
rust-version.workspace = true
default-run = "tibba"

[lints]
workspace = true

# 可选业务样板：默认 full 与历史行为一致。
# 最小二进制：cargo build --no-default-features
# 按需：cargo build --no-default-features --features demo-docker,demo-tenant
[features]
default = ["full"]
full = ["demo-docker", "demo-detector", "demo-tenant", "demo-token"]
# Token 计费 / 账户 / LLM 计价模型（tibba-model-token）+ 注册赠分任务
demo-token = ["dep:tibba-model-token"]
# Docker 镜像分析 API + 后台任务（计费依赖 token 表，故联动 demo-token）
demo-docker = ["demo-token"]
# HTTP 探测调度 / 告警（src/httpstat，依赖 http-stat + quick-js）
demo-detector = ["dep:http-stat", "dep:quick-js"]
# 行级多租户演示路由 /tenant
demo-tenant = []

[dependencies]
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
ctor = "1.0.13"
futures = { workspace = true }
hostname = { workspace = true }
http = { workspace = true }
http-stat = { version = "0.7.1", optional = true }
metrics-exporter-prometheus = { workspace = true }
nanoid = { workspace = true }
quick-js = { version = "0.4.1", optional = true }
rand = { workspace = true }
reqwest = { workspace = true }
mime_guess2 = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tibba-cache = { path = "./tibba-cache" }
tibba-config = { path = "./tibba-config" }
tibba-email = { path = "./tibba-email" }
tibba-error = { path = "./tibba-error" }
tibba-feature = { path = "./tibba-feature" }
tibba-i18n = { path = "./tibba-i18n" }
tibba-job = { path = "./tibba-job" }
tibba-jwt = { path = "./tibba-jwt" }
tibba-llm = { path = "./tibba-llm" }
tibba-middleware = { path = "./tibba-middleware" }
tibba-model = { path = "./tibba-model" }
tibba-model-builtin = { path = "./tibba-model-builtin" }
tibba-model-token = { path = "./tibba-model-token", optional = true }
tibba-notify = { path = "./tibba-notify" }
tibba-oauth = { path = "./tibba-oauth" }
tibba-opendal = { path = "./tibba-opendal" }
tibba-router-common = { path = "./tibba-router-common" }
tibba-router-file = { path = "./tibba-router-file" }
tibba-router-model = { path = "./tibba-router-model" }
tibba-router-user = { path = "./tibba-router-user" }
# process-info：/commons/application 与定时日志需要进程采样
# scheduler：主应用需要 cron 定时任务
tibba-runtime = { path = "./tibba-runtime", features = [
    "process-info",
    "scheduler",
] }
tibba-session = { path = "./tibba-session" }
tibba-sql = { path = "./tibba-sql" }
tibba-tenant = { path = "./tibba-tenant" }
tibba-util = { path = "./tibba-util" }
tibba-webhook = { path = "./tibba-webhook" }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.7.1", features = [
    "compression-br",
    "compression-gzip",
    "compression-zstd",
] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
# env-filter：让 RUST_LOG 支持 `tibba:cache=debug` 这类按 target 过滤的指令。
# 没有它，各 crate 的 LOG_TARGET 约定形同虚设（只能整体调级别）。
tracing-subscriber = { version = "0.3.23", features = ["local-time", "env-filter"] }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
validator = { workspace = true }
num_cpus = "1.17.0"
regex = "1.13.1"
glob = "0.3.4"
substring = { workspace = true }
toml = "1.1.6"

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"

[workspace]
members = [
    "tibba-cache",
    "tibba-config",
    "tibba-crypto",
    "tibba-email",
    "tibba-error",
    "tibba-feature",
    "tibba-job",
    "tibba-jwt",
    "tibba-middleware",
    "tibba-model",
    "tibba-model-builtin",
    "tibba-model-token",
    "tibba-notify",
    "tibba-opendal",
    "tibba-request",
    "tibba-oauth",
    "tibba-rbac",
    "tibba-router-common",
    "tibba-router-file",
    "tibba-router-user",
    "tibba-runtime",
    "tibba-sql",
    "tibba-util",
    "tibba-session",
    "tibba-router-model",
    "tibba-llm",
    "tibba-totp",
    "tibba-webhook",
    "tibba-i18n",
    "tibba-tenant",
]



# 全 workspace 统一的 lint 级别。
#
# 此前 `unwrap_used = "deny"` 只写在根 package 的 `[lints.clippy]` 下，
# 30 个 `tibba-*` 库 crate 一个都不受约束——而真正会被下游依赖、
# panic 影响面最大的恰恰是它们。测试内的 unwrap 由 clippy.toml 的
# `allow-unwrap-in-tests` 放行。
[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.package]
version = "0.2.7"
edition = "2024"
# 取依赖图的真实下限，而不是本仓库语法特性的下限：let-chains 只要 1.88，但
# sysinfo 0.39 要 1.95、sqlx 0.9 要 1.94。声明低于依赖下限等于对下游撒谎——
# 用 1.88 的人会在 cargo 的依赖 MSRV 检查上直接失败，却以为自己满足了要求。
rust-version = "1.95"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/tibba"
repository = "https://github.com/vicanso/tibba"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
# 服务端密码哈希（Argon2id），替代此前的明文 sha256 存储
# std feature 让 password_hash::Error 实现 std::error::Error，供 snafu source 使用
# 0.6 起 std feature 已移除（Error 无条件实现 core::error::Error，snafu source 照常可用），
# 盐由 hash_password 内部经 getrandom 生成，不再需要显式传 RNG，故默认 feature 即可
argon2 = "0.6.0"
arc-swap = "1.9.2"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
base64 = "0.23.1"
bytes = "1.12.1"
bytesize = "2.7.0"
bytesize-serde = "0.2.1"
cached = "4.0.0"
captcha = "1.0.0"
chrono = "0.4.45"
config = "0.15.25"
cookie = "0.18.2"
dashmap = "6.2.1"
dirs = "7.0.0"
futures = "0.3.34"
governor = "0.10.4"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
hex = "0.4.3"
hmac = "0.13.0"
hostname = "0.4.2"
http = "1.5.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
humantime-serde = "1.1.1"
jsonwebtoken = { version = "11.0.0", default-features = false }
resend-rs = { version = "0.32.3", default-features = false, features = [
    "rustls-tls",
] }
image = "0.25.10"
lru = "0.18.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
lz4_flex = "0.14.0"
mime = "0.3.17"
mime_guess2 = "2.3.1"
nanoid = "0.5.0"
once_cell = "1.21.4"
opendal = { version = "0.59.1", features = [
    # 数据库存储后端用 Postgres（与主库一致，复用 objects 表）；此前是 services-mysql，
    # 而本项目早已全面迁到 Postgres、objects 表的 DDL 也是 PG 语法，MySQL 后端用不上它
    "services-postgresql",
    "layers-mime-guess",
    "services-s3",
    "services-fs",
    "services-http",
] }
os_info = { version = "3.15.0", default-features = false }
parse-size = "1.1.0"
path-absolutize = "4.0.1"
pretty_assertions = "1.4.1"
rand = "0.10.2"
# 加密 nonce 的系统熵源。rand_core 0.10 起只剩 trait，OsRng 已移除，
# 直接取 OS 熵源是 GCM nonce 最稳妥的做法（password-hash 生成盐走的也是 getrandom）。
# 取 0.4：rand 0.10 已经把它带进依赖树，不会多编译一份
getrandom = "0.4.3"
redis = { version = "1.7.0", features = ["tokio-comp", "aio"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "query",
    "json",
    "form",
] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
snafu = "0.9.2"
# 关闭默认 feature：any（跨数据库抽象）未使用；数据库时间类型统一用 time（不开 chrono）。
# macros 不能省：migrate! 宏挂在它下面（仅 derive 不够），FromRow 派生也由它提供
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "json",
    "time",
] }
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
substring = "1.4.5"
sysinfo = "0.39.6"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
] }
tokio-cron-scheduler = { version = "0.15.1", features = ["signal", "english"] }
tower = { version = "0.5.3", features = ["timeout"] }
tracing = "0.1.44"
# OpenAPI 文档：utoipa 注解 + Swagger UI（仅 dev/test 环境挂载）
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
tracing-opentelemetry = "0.33.0"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v7"] }
validator = { version = "0.21.0", features = ["derive"] }
# 解析对端证书 DER 取有效期（tibba-request 的 tls-info feature）；默认不启用
x509-parser = "0.18.1"
zstd = "0.14.0"

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tibba-error = { path = "./tibba-error" }
tibba-middleware = { path = "./tibba-middleware" }
tibba-session = { path = "./tibba-session" }
