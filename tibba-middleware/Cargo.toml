[package]
name = "tibba-middleware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tibba", "middleware"]
description = "HTTP middlewares and error localization for tibba"


[lib]
name = "tibba_middleware"
path = "src/lib.rs"

[features]
default = []
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
axum = { workspace = true, features = ["default"] }
axum-extra = { workspace = true }
metrics = { workspace = true }
# 入站请求创建服务端 span 并提取上游 W3C trace 上下文（可选分布式追踪）
opentelemetry = { workspace = true, optional = true }
scopeguard = { workspace = true }
serde = { workspace = true }
snafu = { workspace = true }
subtle = { workspace = true }
tibba-auth = { workspace = true }
tibba-cache = { workspace = true }
tibba-error = { workspace = true }
tibba-runtime = { workspace = true }
tibba-util = { workspace = true, features = ["http"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
urlencoding = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
