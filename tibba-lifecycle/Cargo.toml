[package]
name = "tibba-lifecycle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["tibba", "lifecycle"]
description = "lifecycle hooks and cron scheduler for tibba"

[lib]
name = "tibba_lifecycle"
path = "src/lib.rs"

[features]
default = []
# cron 定时任务（src/scheduler.rs）。tokio-cron-scheduler 传递依赖较重，
# 默认关闭；只用启动/关闭钩子的下游（如 tibba-router-model）无需为其付出编译代价。
scheduler = ["dep:snafu", "dep:tokio-cron-scheduler"]

[dependencies]
dashmap = { workspace = true }
snafu = { workspace = true, optional = true }
tibba-error = { path = "../tibba-error", version = "0.2.6" }
tokio-cron-scheduler = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
