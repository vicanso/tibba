[package]
name = "tibba-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tibba", "model", "sql"]
description = "PostgreSQL pool and core data models for tibba"


[lib]
name = "tibba_model"
path = "src/lib.rs"

[dependencies]
http = { workspace = true }
humantime-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tibba-config = { path = "../tibba-config", version = "0.3.0" }
tibba-error = { path = "../tibba-error", version = "0.3.0" }
# 密码入库前做 Argon2id 哈希（register / update_password）
tibba-crypto = { path = "../tibba-crypto", version = "0.3.0" }
tibba-util = { path = "../tibba-util", version = "0.3.0", default-features = false }
time = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[lints]
workspace = true
