[package]
name = "tibba-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tibba", "model", "sql"]
description = "PostgreSQL pool and core data models for tibba"


[lib]
name = "tibba_model"
path = "src/lib.rs"

[features]
default = []
# 基于 PostgreSQL FOR UPDATE SKIP LOCKED 的异步任务队列与死信重放
job = ["dep:dashmap", "dep:metrics", "tokio/time", "tokio/sync"]

[dependencies]
dashmap = { workspace = true, optional = true }
http = { workspace = true }
humantime-serde = { workspace = true }
metrics = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tibba-config = { workspace = true }
tibba-error = { workspace = true }
# 密码入库前做 Argon2id 哈希（register / update_password）
tibba-crypto = { workspace = true }
tibba-util = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[lints]
workspace = true
