[package]
name = "tibba-router"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["tibba", "router"]
description = "HTTP routers for tibba (common, user, model, rbac, file, job)"
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# 文件管理路由（/files/*），依赖 tibba-opendal 与 mime_guess2
file = ["axum/multipart", "dep:mime_guess2", "dep:tibba-opendal"]
# 任务队列运维路由（/jobs/*），依赖 tibba-model/job
job = ["tibba-model/job"]
# 邮箱验证与密码重置路由（/users/email/* 与 /users/password/reset/*）
email = ["dep:tibba-request", "tibba-request/email"]
# /commons/application 采集 CPU / 内存 / FD / 磁盘 I/O（依赖 sysinfo）
process-info = ["tibba-runtime/process-info"]
# JWT 备选登录/刷新/登出路由
jwt = ["tibba-auth/jwt"]
# TOTP 两步验证（/users/totp/* 与 /users/login/mfa 等）
totp = ["tibba-auth/totp"]
# GitHub / Google OAuth 登录路由
oauth = ["tibba-auth/oauth"]
# API Key / 个人访问令牌（/users/api-keys* 与 api_key_auth 中间件）
api-key = []
# 运行期配置化只读 SQL 查询接口（/queries/{group}/{name} 与 /sql-queries）
sql-query = []
# 应用级签名鉴权（app_id + ts + sign 查询参数与 /apps 管理端点）
app-auth = []

[dependencies]
axum = { workspace = true, features = ["default"] }
axum-extra = { workspace = true }
hostname = { workspace = true }
humantime = { workspace = true }
mime_guess2 = { workspace = true, optional = true }
nanoid = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
tibba-auth = { workspace = true }
tibba-cache = { workspace = true }
tibba-crypto = { workspace = true }
tibba-error = { workspace = true }
tibba-middleware = { workspace = true }
tibba-model = { workspace = true }
tibba-opendal = { workspace = true, optional = true }
tibba-request = { workspace = true, optional = true }
tibba-runtime = { workspace = true }
tibba-util = { workspace = true, features = ["http"] }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
validator = { workspace = true }
zeroize = { workspace = true }
