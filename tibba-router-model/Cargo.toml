[package]
name = "tibba-router-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tibba", "router", "model"]
description = "model router for tibba"

[lib]
name = "tibba_router_model"
path = "src/lib.rs"

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
sqlx = { workspace = true }
tibba-error = { path = "../tibba-error", version = "0.2.6" }
tibba-model = { path = "../tibba-model", version = "0.2.6" }
# 仅用其 BoxFuture 类型别名，故两个 feature 都不开
tibba-runtime = { path = "../tibba-runtime", version = "0.2.6" }
tibba-session = { path = "../tibba-session", version = "0.2.6" }
tibba-util = { path = "../tibba-util", version = "0.2.6", default-features = false }
utoipa = { workspace = true }
validator = { workspace = true }

[lints]
workspace = true
